<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eugeniu Girla — An Odyssey in Five Landfalls</title>
<meta name="description" content="Eugeniu Girla — 5× Founder & Builder · HR Technology · AI & Talent. An interactive CV charted across twenty years, from Moldova to Athens.">
<meta property="og:title" content="Eugeniu Girla — An Odyssey in Five Landfalls">
<meta property="og:description" content="5× Founder & Builder · HR Technology · AI & Talent. An interactive CV charted across twenty years.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%}
  body{background:#efeadd;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-family:'Spectral',Georgia,serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ul{list-style:none}
  ::selection{background:rgba(180,90,55,0.18)}
  a{color:inherit}
  @keyframes odSheen{0%,100%{opacity:.35}50%{opacity:.7}}
  @keyframes odFog{0%{transform:translateX(0)}100%{transform:translateX(6px)}}
  @keyframes odBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes odRing{0%{transform:scale(.75);opacity:.65}100%{transform:scale(2.3);opacity:0}}
  @keyframes odUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes odStar{0%,100%{opacity:.25}50%{opacity:.8}}
  @media print{
    .od-noprint{display:none !important}
    #cvModal{position:absolute !important;inset:0 !important;background:#fff !important;padding:0 !important;overflow:visible !important}
    #cvModal .od-cv{box-shadow:none !important;margin:0 !important;max-width:none !important}
    body{background:#fff !important}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";
(function(){

  /* ----------------------------- DATA ----------------------------- */
  const ISLANDS = [
    { id:'origin', short:'The Early Waters', name:'The Early Waters', place:'Moldova · Ukraine · CEE',
      coord:'47°00′N 28°52′E', dates:'2005 – 2020', yr:'2005',
      subtitle:'Where it began — building organizations from blank sheets, long before anyone called it a venture.',
      x:13, y:30, size:46, treasure:{value:'10+',label:'countries'},
      roles:[
        {title:'AIESEC Moldova & Ukraine', period:'2005 – 2008', bullets:['Built AIESEC Moldova from a blank sheet at nineteen — still running today','As VP Talent at AIESEC Ukraine, managed 700+ people across 16 cities']},
        {title:'TalentKapital Ukraine', period:'2008 – 2010', bullets:['Co-Founder & Managing Partner — business simulation-based corporate training']},
        {title:'Kintaly / Târgul de Carieră', period:'2011 – 2019', bullets:["Co-founded one of CEE's largest career-fair businesses; events across 7 countries; sold shares in 2016"]},
        {title:'AND Training', period:'2012 – 2019', bullets:["Trainer at one of Moldova's top academies — 7+ years of leadership, sales, HR & team programs"]},
        {title:'Cluj Tech Society', period:'2019 – 2020', bullets:['IT Recruitment Community Manager for the largest free tech recruitment event in CEE']}
      ]},
    { id:'gaus', short:'GAUS Algorithm', name:'GAUS Algorithm', place:'Estonia',
      coord:'59°26′N 24°45′E', dates:'Jan 2017 – Jan 2020', yr:'2017',
      subtitle:'An AI recruitment startup in Estonia in 2017 — before AI was the world’s obsession.',
      x:30, y:17, size:40, treasure:{value:'5×',label:'ventures co-founded'},
      roles:[
        {title:'Co-Founder & CEO', period:'Jan 2017 – Jan 2020', bullets:["Co-founded one of CEE's first AI-powered IT recruitment platforms — secured funding and a place in a leading Estonian B2B accelerator","Built the matching algorithm from scratch; ran fundraising, product and go-to-market across EU and Baltic markets","Learned the full startup arc firsthand — idea to accelerator to investor conversations to pivot decisions"]}
      ]},
    { id:'xor', short:'XOR.ai', name:'XOR.ai', place:'EMEA Territory',
      coord:'47°30′N 19°02′E', dates:'Jan 2020 – Dec 2021', yr:'2020',
      subtitle:'AI-powered recruitment automation. Clients including IKEA, McDonald’s, Exxon Mobil, ManpowerGroup.',
      x:45, y:48, size:38, treasure:null,
      roles:[
        {title:'EMEA Region Director', period:'Jan 2020 – Dec 2021', bullets:["Built XOR.ai's EMEA territory from zero — no team, no pipeline, no market presence on day one","Closed enterprise accounts including MOL Group as the region's flagship client","Opened conversations about AI recruitment automation with senior HR leaders when most had never heard of it"]}
      ]},
    { id:'index', short:'Index.dev', name:'Index.dev', place:'Athens, Greece',
      coord:'37°59′N 23°44′E', dates:'Jan 2022 – Present', yr:'2022',
      subtitle:'Global platform connecting fast-scaling companies with vetted full-time remote engineers.',
      x:66, y:62, size:52, treasure:{value:'10×',label:'talent network growth'},
      roles:[
        {title:'Global Growth Partner & Board Member', period:'Jan 2025 – Present', bullets:['Drive global growth strategy including M&A — led the Codemotion.us acquisition and its full integration','Own the company’s most strategic client partnerships and revenue relationships, including the Andela partnership','Serve on the Board of Directors, shaping long-term direction and investment decisions']},
        {title:'VP of Talent Platform', period:'Jan 2024 – Feb 2025', bullets:['Grew the supply network from 2,000 to 20,000 vetted professionals — 10× in under two years','Led talent acquisition, vetting pipeline and platform product experience']},
        {title:'VP of Talent', period:'Oct 2022 – Jan 2024', bullets:['Built talent acquisition processes for a rapidly scaling global remote platform serving US, EU & UK companies']},
        {title:'Director of Sourcing', period:'Jan 2022 – Oct 2022', bullets:['Built the sourcing function from scratch as an early growth-team member']}
      ]},
    { id:'mind', short:'MIND', name:'MIND', place:'Athens, Greece',
      coord:'37°58′N 23°43′E', dates:'Jan 2025 – Present', yr:'2025',
      subtitle:'AI Talent & AI Agents platform — an Index.dev spinoff helping companies find and deploy AI talent.',
      x:82, y:46, size:38, treasure:null,
      roles:[
        {title:'Project Manager', period:'Jan 2025 – Present', bullets:['Co-building the go-to-market and operational model for a new AI-focused talent platform spinning out of Index.dev']}
      ]}
  ];

  const CAPABILITIES = ['Markets & Revenue Engines','AI-Powered HR Products','Talent Platforms','M&A & Partnerships','EMEA / CEE / MENA','Startup Ventures','Remote Teams','Training & L&D'];

  const THEME_A = {
    bg:'#efeadd', panel:'#f7f3ea', fg:'#1d2b30', fg2:'#33454b', mut:'#857c6b',
    faint:'rgba(29,43,48,0.05)', line:'rgba(29,43,48,0.15)', acc:'oklch(0.6 0.1 42)', acc2:'oklch(0.6 0.1 232)',
    sea:'#e4e8e2', fog:'rgba(29,43,48,0.12)', fogFill:'rgba(232,228,217,0.86)'
  };
  const THEME_B = {
    bg:'#141d24', panel:'#1b2730', fg:'#ece6d8', fg2:'rgba(236,230,216,0.82)', mut:'rgba(236,230,216,0.5)',
    faint:'rgba(236,230,216,0.07)', line:'rgba(236,230,216,0.18)', acc:'oklch(0.78 0.085 78)', acc2:'oklch(0.78 0.085 78)',
    sea:'#10181e', fog:'rgba(236,230,216,0.16)', fogFill:'rgba(20,29,36,0.82)'
  };
  const themeFor = m => m==='B'? THEME_B : THEME_A;

  function cvSections(){
    const exp = ISLANDS.slice().reverse().filter(i=>i.id!=='origin').map(i=>({
      head:i.name, meta:i.dates+' · '+i.place, sub:i.subtitle,
      bullets:i.roles.flatMap(r=>[r.title+' ('+r.period+')', ...r.bullets])
    }));
    const origin=ISLANDS[0];
    exp.push({head:origin.name, meta:origin.dates+' · '+origin.place, sub:origin.subtitle,
      bullets:origin.roles.map(r=>r.title+' — '+r.bullets.join('; '))});
    return [
      {title:'Profile', entries:[{head:"20 years of starting things",meta:'',sub:"A builder, not a scorekeeper — fluent in the language of HR leaders because he has been one. Currently building at board level at Index.dev and co-leading MIND, its AI talent & agents spinoff.",bullets:[]}]},
      {title:'Experience', entries:exp},
      {title:'Education', entries:[
        {head:'Academia de Studii Economice din Moldova',meta:'2015 – 2020',sub:'BASc, Food Science & Technology',bullets:[]},
        {head:'National College "Gheorghe Lazăr", Bucharest',meta:'1999 – 2003',sub:'Diploma, Social Studies',bullets:[]},
        {head:'AIESEC International',meta:'2004 – 2008',sub:'Leadership & Organisational Development',bullets:[]}
      ]},
      {title:'Certifications & Training', entries:[{head:'',meta:'',sub:'',bullets:[
        'LinkedIn Recruiter: AI-Powered Talent Acquisition','Prompt Engineering: How to Talk to the AIs',
        'Train the Trainers L1 — Edurom, Romania (2005); L2 — AIESEC International, Netherlands (2006)','Attendee — World Staffing Summit 2022'
      ]}]},
      {title:'Languages', entries:[{head:'',meta:'',sub:'',bullets:['English (C2 — Proficient)','Romanian (Native)','Russian (C2 — Proficient)','Ukrainian (B1 — Intermediate)']}]}
    ];
  }

  const ROMAN=['I','II','III','IV','V'];

  /* ----------------------------- STATE ----------------------------- */
  const state = { mode:'A', discovered:[], active:null, view:'journey', hideArrival:false };
  let lastActiveId = undefined;

  /* ----------------------------- HELPERS ----------------------------- */
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function node(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

  /* ----------------------------- ACTIONS ----------------------------- */
  function selectIsland(id){
    const idx=ISLANDS.findIndex(i=>i.id===id);
    const disc=state.discovered;
    if(state.mode==='B'){
      const nextIdx=ISLANDS.findIndex(i=>!disc.includes(i.id));
      if(!(disc.includes(id) || idx===nextIdx)) return;
    }
    if(!disc.includes(id)) state.discovered=[...disc,id];
    state.active=id; state.hideArrival=true; update();
  }
  function sail(){ const next=ISLANDS.find(i=>!state.discovered.includes(i.id)); if(next) selectIsland(next.id); }
  function closePanel(){ state.active=null; state.hideArrival=false; update(); }
  function pickMode(m){ state.mode=m; state.active=null; update(); }
  function reset(){ state.discovered=[]; state.active=null; state.hideArrival=false; update(); }
  function openCV(){ state.view='cv'; update(); }
  function closeCV(){ state.view='journey'; update(); }
  function hideArrivalFn(){ state.hideArrival=true; update(); }

  /* ----------------------------- COMPUTE ----------------------------- */
  function compute(){
    const t=themeFor(state.mode); const disc=state.discovered;
    const A=state.mode==='A', B=state.mode==='B';
    const nextIdx=ISLANDS.findIndex(i=>!disc.includes(i.id));
    const allDiscovered = disc.length===ISLANDS.length;
    let lastReached=-1; ISLANDS.forEach((i,k)=>{ if(disc.includes(i.id)) lastReached=k; });

    const isles = ISLANDS.map((i,idx)=>{
      const found = disc.includes(i.id);
      const hint = !found && idx===nextIdx;
      return { idx, found, hint,
        fill: found? t.acc2 : 'rgba(120,120,120,0.25)',
        stroke: found? t.acc2 : t.mut,
        peak: found? t.acc : 'transparent',
        fogOp: found?0:1, labelOp: found?1:(hint?0.55:0.3), coordOp: found?0.9:0,
        nodeFill: found? t.acc : 'transparent',
        nodeStroke: found? t.acc : (hint? t.acc : t.mut),
        nodeGlow: found? '0 0 12px '+t.acc : 'none',
        yrOp: found?0.9:0
      };
    });

    const routePoints = ISLANDS.filter(i=>disc.includes(i.id)).map(i=>i.x+','+i.y).join(' ');
    const treasures = [
      {value:'10+',label:'countries', island:'origin'},
      {value:'5×',label:'ventures co-founded', island:'gaus'},
      {value:'10×',label:'talent network growth', island:'index'},
      {value:'20',label:'yrs in HR & AI', island:null}
    ].map(tr=>{
      const got = tr.island? disc.includes(tr.island) : allDiscovered;
      return {...tr, got,
        bg: got? (B?'rgba(236,230,216,0.05)':'rgba(180,90,55,0.06)') : 'transparent',
        fg: got? t.acc : t.mut, tag: got? t.acc : t.mut,
        stateTxt: got? '◆ secured' : '◇ uncharted'
      };
    });

    const active = state.active ? ISLANDS.find(i=>i.id===state.active) : null;
    const panelOpen = !!active;
    const baseEdge = 100/(ISLANDS.length*2);
    const litFrac = lastReached<0?0: lastReached/(ISLANDS.length-1);
    const shipLeft = lastReached<0? baseEdge : ((lastReached+0.5)/ISLANDS.length*100);
    const nextName = nextIdx>=0? ISLANDS[nextIdx].short : '';

    return {
      t, A, B, isles, treasures, routePoints, active, panelOpen, allDiscovered, lastReached,
      progressText: disc.length+' / '+ISLANDS.length+' charted',
      captionA: allDiscovered? 'All landfalls charted. The route runs from Moldova to Athens.' : 'Uncharted waters. Select an island to make landfall and lift the fog.',
      captionB: allDiscovered? 'The crossing is complete — five landfalls, one builder, twenty years.' : (lastReached<0? 'A linear crossing from the early waters to Athens. Sail one landfall at a time.' : 'Currently at '+ISLANDS[lastReached].short+'. The horizon holds '+(ISLANDS.length-disc.length)+' more.'),
      canSail: !allDiscovered,
      sailLabel: lastReached<0? 'Begin the crossing →' : ('Sail to '+nextName+' →'),
      baseEdge, litFrac, shipLeft,
      showArrival: allDiscovered && !panelOpen && !state.hideArrival && state.view==='journey',
      showCV: state.view==='cv'
    };
  }

  /* ----------------------------- BUILD (once) ----------------------------- */
  const root=document.getElementById('root');
  const R={};

  function buildVars(t){
    return `--bg:${t.bg};--panel:${t.panel};--fg:${t.fg};--fg2:${t.fg2};--mut:${t.mut};--faint:${t.faint};--line:${t.line};--acc:${t.acc};--acc2:${t.acc2};--sea:${t.sea};--fog:${t.fog};--fogFill:${t.fogFill}`;
  }

  function build(){
    const t=THEME_A;
    R.wrap = node(`<div style="${buildVars(t)};min-height:100vh;width:100%;background:var(--bg);color:var(--fg);transition:background .7s ease,color .7s ease;position:relative;overflow:hidden"></div>`);

    // stars (mode B)
    R.stars = node(`<div style="position:absolute;inset:0;pointer-events:none;display:none;background:radial-gradient(1px 1px at 12% 22%,rgba(236,230,216,.7),transparent),radial-gradient(1px 1px at 28% 64%,rgba(236,230,216,.5),transparent),radial-gradient(1px 1px at 47% 14%,rgba(236,230,216,.6),transparent),radial-gradient(1px 1px at 63% 78%,rgba(236,230,216,.45),transparent),radial-gradient(1px 1px at 78% 34%,rgba(236,230,216,.6),transparent),radial-gradient(1px 1px at 88% 60%,rgba(236,230,216,.5),transparent),radial-gradient(1px 1px at 55% 46%,rgba(236,230,216,.4),transparent),radial-gradient(1px 1px at 36% 88%,rgba(236,230,216,.5),transparent);animation:odStar 7s ease-in-out infinite"></div>`);
    R.wrap.appendChild(R.stars);

    buildHeader();
    buildLedger();
    buildStage();
    buildPanel();
    buildArrival();
    buildCV();

    root.appendChild(R.wrap);

    // global escape
    document.addEventListener('keydown',e=>{
      if(e.key!=='Escape') return;
      if(state.view==='cv') closeCV();
      else if(state.active) closePanel();
      else if(!state.hideArrival) hideArrivalFn();
    });
  }

  function buildHeader(){
    R.header = node(`
    <header class="od-noprint" style="position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between;padding:clamp(20px,3.4vw,40px) clamp(20px,4vw,56px) 0">
      <div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--acc);margin-bottom:10px">An Odyssey in Five Landfalls</div>
        <h1 style="font-weight:400;font-size:clamp(28px,4.4vw,46px);line-height:1;letter-spacing:-.01em">Eugeniu Girla</h1>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:clamp(10px,1.05vw,12.5px);letter-spacing:.06em;color:var(--mut);margin-top:12px">5× Founder &amp; Builder · HR Technology · AI &amp; Talent</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:14px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
          <div style="display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden">
            <button data-r="segA" style="padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;transition:.3s">I · The Chart</button>
            <button data-r="segB" style="padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border-left:1px solid var(--line);transition:.3s">II · The Crossing</button>
          </div>
          <button data-r="cvBtn" style="padding:8px 16px;border:1px solid var(--acc);border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);transition:.3s">View / Download CV</button>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
          <button data-r="summaryBtn" style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);text-decoration:underline;text-underline-offset:3px;display:none">Voyage Summary</button>
          <button data-r="resetBtn" style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)">Re-fog ⟲</button>
          <div data-r="progress" style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--mut)"></div>
        </div>
      </div>
    </header>`);
    R.wrap.appendChild(R.header);
    R.segA=R.header.querySelector('[data-r="segA"]');
    R.segB=R.header.querySelector('[data-r="segB"]');
    R.progress=R.header.querySelector('[data-r="progress"]');
    R.summaryBtn=R.header.querySelector('[data-r="summaryBtn"]');
    R.segA.onclick=()=>pickMode('A');
    R.segB.onclick=()=>pickMode('B');
    R.header.querySelector('[data-r="cvBtn"]').onclick=openCV;
    R.header.querySelector('[data-r="resetBtn"]').onclick=reset;
    R.summaryBtn.onclick=()=>{ state.active=null; state.hideArrival=false; update(); };
  }

  function buildLedger(){
    R.ledger = node(`<div class="od-noprint" style="position:relative;z-index:5;display:flex;flex-wrap:wrap;gap:10px;padding:clamp(18px,2.4vw,28px) clamp(20px,4vw,56px) clamp(6px,1.4vw,16px)"></div>`);
    R.treasureEls=[];
    [0,1,2,3].forEach(()=>{
      const el=node(`
      <div style="flex:1 1 150px;min-width:140px;border:1px solid var(--line);border-radius:2px;padding:14px 16px;transition:.5s ease;position:relative;overflow:hidden">
        <div data-r="tag" style="position:absolute;top:10px;right:12px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em"></div>
        <div data-r="val" style="font-weight:300;font-size:clamp(26px,3.4vw,38px);line-height:1;letter-spacing:-.02em;transition:.5s"></div>
        <div data-r="lbl" style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--mut);margin-top:9px"></div>
      </div>`);
      R.ledger.appendChild(el);
      R.treasureEls.push({box:el, tag:el.querySelector('[data-r="tag"]'), val:el.querySelector('[data-r="val"]'), lbl:el.querySelector('[data-r="lbl"]')});
    });
    R.wrap.appendChild(R.ledger);
  }

  function buildStage(){
    R.main = node(`<main style="position:relative;z-index:4;padding:clamp(6px,1.6vw,18px) clamp(20px,4vw,56px) clamp(28px,4vw,56px)"></main>`);
    buildChart();
    buildCrossing();
    R.main.appendChild(R.chart);
    R.main.appendChild(R.crossing);
    R.wrap.appendChild(R.main);
  }

  function buildChart(){
    const tA=THEME_A;
    R.chart = node(`
    <div style="${buildVars(tA)};position:relative;width:100%;aspect-ratio:16/9;min-height:380px;border:1px solid var(--line);border-radius:3px;background:var(--sea);overflow:hidden;box-shadow:inset 0 0 80px rgba(29,43,48,.05)">
      <div style="position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,transparent,transparent 59px,var(--faint) 59px,var(--faint) 60px),repeating-linear-gradient(90deg,transparent,transparent 59px,var(--faint) 59px,var(--faint) 60px)"></div>
      <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.5),transparent 60%);animation:odSheen 9s ease-in-out infinite"></div>
      <div style="position:absolute;top:12px;left:12px;width:16px;height:16px;border-top:1px solid var(--line);border-left:1px solid var(--line)"></div>
      <div style="position:absolute;top:12px;right:12px;width:16px;height:16px;border-top:1px solid var(--line);border-right:1px solid var(--line)"></div>
      <div style="position:absolute;bottom:12px;left:12px;width:16px;height:16px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)"></div>
      <div style="position:absolute;bottom:12px;right:12px;width:16px;height:16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)"></div>
      <div style="position:absolute;top:20px;right:26px;width:64px;height:64px;opacity:.5">
        <svg viewBox="0 0 100 100" style="width:100%;height:100%">
          <line x1="50" y1="6" x2="50" y2="94" stroke="var(--mut)" stroke-width="1"></line>
          <line x1="6" y1="50" x2="94" y2="50" stroke="var(--mut)" stroke-width="1"></line>
          <polygon points="50,14 56,50 50,86 44,50" fill="var(--acc)"></polygon>
          <polygon points="14,50 50,44 86,50 50,56" fill="none" stroke="var(--mut)" stroke-width="1"></polygon>
        </svg>
        <div style="position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--mut)">N</div>
      </div>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
        <polyline data-r="route" points="" fill="none" stroke="var(--acc)" stroke-width="1.2" stroke-dasharray="2.4 2.4" vector-effect="non-scaling-stroke" opacity="0.8"></polyline>
      </svg>
      <div data-r="capA" style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--mut);text-align:center;padding:0 16px"></div>
    </div>`);
    R.route=R.chart.querySelector('[data-r="route"]');
    R.capA=R.chart.querySelector('[data-r="capA"]');
    R.chartIsles=ISLANDS.map((i,idx)=>{
      const btn=node(`
      <button style="position:absolute;left:${i.x}%;top:${i.y}%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:120px">
        <span data-r="ring" style="position:absolute;top:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--acc);animation:odRing 2.4s ease-out infinite;pointer-events:none;display:none"></span>
        <span style="position:relative;width:${i.size}px;height:${i.size}px;display:block;animation:odBob ${3.4+(idx%3)*0.5}s ease-in-out infinite">
          <span data-r="shape" style="position:absolute;inset:0;border-radius:46% 54% 50% 50% / 56% 50% 50% 44%;transition:.6s ease"></span>
          <span data-r="peak" style="position:absolute;inset:34% 30% 30% 40%;border-radius:50%;transition:.6s ease"></span>
          <span data-r="fog" style="position:absolute;inset:-7px;border-radius:50%;background-image:repeating-linear-gradient(45deg,var(--fog),var(--fog) 2px,transparent 2px,transparent 6px);background-color:var(--fogFill);animation:odFog 4s ease-in-out infinite alternate;transition:opacity .7s ease;pointer-events:none"></span>
        </span>
        <span data-r="label" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--fg);transition:.6s;text-align:center">${esc(i.short)}</span>
        <span data-r="coord" style="font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;color:var(--mut);transition:.6s">${esc(i.coord)}</span>
      </button>`);
      btn.onclick=()=>selectIsland(i.id);
      R.chart.appendChild(btn);
      return {ring:btn.querySelector('[data-r="ring"]'),shape:btn.querySelector('[data-r="shape"]'),peak:btn.querySelector('[data-r="peak"]'),fog:btn.querySelector('[data-r="fog"]'),label:btn.querySelector('[data-r="label"]'),coord:btn.querySelector('[data-r="coord"]')};
    });
  }

  function buildCrossing(){
    const tB=THEME_B;
    R.crossing = node(`
    <div style="${buildVars(tB)};display:none;position:relative;width:100%;padding:clamp(40px,8vw,90px) 2% clamp(20px,4vw,40px)">
      <div style="position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:6px">
        <div data-r="base" style="position:absolute;top:13px;height:1px;background:var(--line)"></div>
        <div data-r="lit" style="position:absolute;top:13px;height:1px;background:var(--acc);transform-origin:left center;transition:transform .7s ease;box-shadow:0 0 10px var(--acc)"></div>
        <div data-r="ship" style="position:absolute;top:13px;transform:translate(-50%,-50%);transition:left .7s cubic-bezier(.4,0,.2,1);animation:odBob 3.2s ease-in-out infinite;z-index:3">
          <svg viewBox="0 0 24 24" style="width:22px;height:22px"><polygon points="12,3 19,20 12,16 5,20" fill="var(--acc)"></polygon></svg>
        </div>
        <div data-r="nodes" style="display:contents"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:clamp(34px,5vw,60px)">
        <div data-r="capB" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);text-align:center;max-width:520px;line-height:1.7"></div>
        <button data-r="sail" style="padding:13px 30px;border:1px solid var(--acc);border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bg);background:var(--acc);transition:.3s"></button>
      </div>
    </div>`);
    R.base=R.crossing.querySelector('[data-r="base"]');
    R.lit=R.crossing.querySelector('[data-r="lit"]');
    R.ship=R.crossing.querySelector('[data-r="ship"]');
    R.capB=R.crossing.querySelector('[data-r="capB"]');
    R.sail=R.crossing.querySelector('[data-r="sail"]');
    R.sail.onclick=sail;
    const nodesWrap=R.crossing.querySelector('[data-r="nodes"]');
    R.crossIsles=ISLANDS.map(i=>{
      const btn=node(`
      <button style="flex:1 1 0;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:0">
        <span style="position:relative;width:26px;height:26px;display:flex;align-items:center;justify-content:center">
          <span data-r="ring" style="position:absolute;width:26px;height:26px;border-radius:50%;border:1px solid var(--acc);animation:odRing 2.4s ease-out infinite;display:none"></span>
          <span data-r="dot" style="width:13px;height:13px;border-radius:50%;transition:.5s"></span>
        </span>
        <span data-r="coord" style="font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;color:var(--mut);transition:.5s">${esc(i.coord)}</span>
        <span data-r="label" style="font-weight:400;font-size:clamp(12px,1.4vw,16px);color:var(--fg);transition:.5s;text-align:center;line-height:1.25">${esc(i.short)}</span>
        <span data-r="yr" style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.05em;color:var(--mut);transition:.5s">${esc(i.yr)}</span>
      </button>`);
      btn.onclick=()=>selectIsland(i.id);
      nodesWrap.appendChild(btn);
      return {ring:btn.querySelector('[data-r="ring"]'),dot:btn.querySelector('[data-r="dot"]'),coord:btn.querySelector('[data-r="coord"]'),label:btn.querySelector('[data-r="label"]'),yr:btn.querySelector('[data-r="yr"]')};
    });
  }

  function buildPanel(){
    R.backdrop = node(`<div class="od-noprint" style="position:fixed;inset:0;z-index:40;background:rgba(15,20,24,.34);opacity:0;pointer-events:none;transition:opacity .5s ease"></div>`);
    R.backdrop.onclick=closePanel;
    R.panel = node(`<aside class="od-noprint" style="${buildVars(THEME_A)};color:var(--fg)"></aside>`);
    R.panelInner = node(`<div></div>`);
    R.panel.appendChild(R.panelInner);
    R.wrap.appendChild(R.backdrop);
    R.wrap.appendChild(R.panel);
  }

  function buildArrival(){
    const t=THEME_A;
    R.arrival = node(`
    <div class="od-noprint" style="${buildVars(t)};position:fixed;inset:0;z-index:60;background:rgba(15,20,24,.5);display:none;align-items:center;justify-content:center;padding:24px">
      <div data-r="card" style="width:min(660px,94vw);max-height:90vh;overflow-y:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:clamp(30px,4vw,52px);box-shadow:0 30px 90px rgba(15,20,24,.3)">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:16px">Landfall · Athens, Present Day</div>
        <h2 style="font-weight:300;font-size:clamp(26px,3.6vw,40px);line-height:1.1;letter-spacing:-.01em;margin-bottom:20px">The voyage, charted in full.</h2>
        <p style="font-weight:300;font-size:clamp(15px,1.7vw,17px);line-height:1.6;color:var(--fg2);margin-bottom:26px;text-wrap:pretty">Twenty years of starting things — from a blank-sheet AIESEC chapter at nineteen to an AI startup before the world's obsession, to building EMEA territories and a board seat. Not a scorekeeper. A builder who speaks the language of HR leaders fluently, because he has been one.</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px">
          ${CAPABILITIES.map(cap=>`<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--fg2);border:1px solid var(--line);border-radius:2px;padding:6px 11px">${esc(cap)}</span>`).join('')}
        </div>
        <div style="height:1px;background:var(--line);margin-bottom:24px"></div>
        <div style="display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between">
          <div style="display:flex;flex-direction:column;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--fg2)">
            <a href="mailto:eugen.girla@gmail.com" style="color:var(--fg2);text-decoration:none">✉ eugen.girla@gmail.com</a>
            <a href="https://www.linkedin.com/in/eugenegarla" target="_blank" rel="noopener" style="color:var(--fg2);text-decoration:none">in/eugenegarla ↗</a>
            <span style="color:var(--mut)">+373 694 101 63 · Athens, GR</span>
          </div>
          <div style="display:flex;gap:10px">
            <button data-r="revisit" style="padding:12px 20px;border:1px solid var(--line);border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)">Revisit Chart</button>
            <button data-r="arrCV" style="padding:12px 22px;border:1px solid var(--acc);border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--acc)">View / Download CV</button>
          </div>
        </div>
      </div>
    </div>`);
    R.arrival.onclick=hideArrivalFn;
    R.arrival.querySelector('[data-r="card"]').onclick=e=>e.stopPropagation();
    R.arrival.querySelector('[data-r="revisit"]').onclick=hideArrivalFn;
    R.arrival.querySelector('[data-r="arrCV"]').onclick=openCV;
    R.wrap.appendChild(R.arrival);
  }

  function buildCV(){
    R.cv = node(`
    <div id="cvModal" style="position:fixed;inset:0;z-index:80;background:rgba(15,20,24,.55);overflow-y:auto;padding:clamp(16px,3vw,44px);display:none">
      <div class="od-cv" style="max-width:820px;margin:0 auto;background:#fdfbf6;color:#1d2b30;border-radius:3px;padding:clamp(34px,5vw,64px);box-shadow:0 30px 90px rgba(15,20,24,.35)">
        <div class="od-noprint" style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:24px">
          <button data-r="print" style="padding:10px 18px;border:1px solid oklch(0.6 0.1 42);border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:oklch(0.6 0.1 42)">Print / Save PDF</button>
          <button data-r="cvClose" style="padding:10px 18px;border:1px solid rgba(29,43,48,.2);border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#1d2b30">Close ✕</button>
        </div>
        <h1 style="font-weight:400;font-size:34px;letter-spacing:-.01em;margin-bottom:6px">Eugeniu Girla</h1>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;color:oklch(0.6 0.1 42);margin-bottom:6px">5× Founder &amp; Builder · HR Technology · AI &amp; Talent</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#857c6b;margin-bottom:26px">Athens, Greece · eugen.girla@gmail.com · +373 694 101 63 · in/eugenegarla</div>
        <div style="height:2px;background:#1d2b30;margin-bottom:22px"></div>
        <div data-r="cvSecs"></div>
      </div>
    </div>`);
    const secWrap=R.cv.querySelector('[data-r="cvSecs"]');
    cvSections().forEach(sec=>{
      secWrap.appendChild(node(`
      <div style="margin-bottom:26px">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:oklch(0.6 0.1 42);margin-bottom:14px">${esc(sec.title)}</div>
        ${sec.entries.map(e=>`
          <div style="margin-bottom:14px">
            <div style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between">
              <div style="font-weight:500;font-size:15px">${esc(e.head)}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#857c6b">${esc(e.meta)}</div>
            </div>
            ${e.sub?`<div style="font-style:italic;font-weight:300;font-size:13px;color:#4a5860;margin-top:3px">${esc(e.sub)}</div>`:''}
            ${e.bullets.map(b=>`<div style="display:flex;gap:9px;font-weight:300;font-size:13px;line-height:1.5;color:#33454b;margin-top:6px"><span style="flex:none;margin-top:7px;width:4px;height:4px;transform:rotate(45deg);background:oklch(0.6 0.1 42)"></span><span style="text-wrap:pretty">${esc(b)}</span></div>`).join('')}
          </div>`).join('')}
      </div>`));
    });
    R.cv.querySelector('[data-r="print"]').onclick=()=>window.print();
    R.cv.querySelector('[data-r="cvClose"]').onclick=closeCV;
    R.wrap.appendChild(R.cv);
  }

  /* ----------------------------- UPDATE (per state) ----------------------------- */
  function update(){
    const v=compute(); const t=v.t;

    // theme vars on wrapper, panel, arrival
    setVars(R.wrap, t); setVars(R.panel, t); setVars(R.arrival, t);

    R.stars.style.display = v.B? 'block':'none';

    // header
    R.progress.textContent = v.progressText;
    R.summaryBtn.style.display = v.allDiscovered? 'inline-block':'none';
    R.segA.style.background = v.A? t.acc:'transparent';
    R.segA.style.color = v.A? t.bg:t.fg;
    R.segB.style.background = v.B? t.acc:'transparent';
    R.segB.style.color = v.B? t.bg:t.fg;

    // ledger
    v.treasures.forEach((tr,i)=>{
      const e=R.treasureEls[i];
      e.box.style.background=tr.bg;
      e.tag.textContent=tr.stateTxt; e.tag.style.color=tr.tag;
      e.val.textContent=tr.value; e.val.style.color=tr.fg;
      e.lbl.textContent=tr.label;
    });

    // stage toggle
    R.chart.style.display = v.A? 'block':'none';
    R.crossing.style.display = v.B? 'block':'none';

    // chart islands (always theme A — visuals state-driven)
    if(v.A){
      R.route.setAttribute('points', v.routePoints);
      R.capA.textContent=v.captionA;
      v.isles.forEach((isl,i)=>{
        const e=R.chartIsles[i];
        e.ring.style.display = isl.hint? 'block':'none';
        e.shape.style.background = isl.fill;
        e.shape.style.border = '1px solid '+isl.stroke;
        e.peak.style.background = isl.peak;
        e.fog.style.opacity = isl.fogOp;
        e.label.style.opacity = isl.labelOp;
        e.coord.style.opacity = isl.coordOp;
      });
    }

    // crossing nodes
    if(v.B){
      R.base.style.left=v.baseEdge+'%'; R.base.style.right=v.baseEdge+'%';
      R.lit.style.left=v.baseEdge+'%'; R.lit.style.right=v.baseEdge+'%';
      R.lit.style.transform='scaleX('+v.litFrac+')';
      R.ship.style.left=v.shipLeft+'%';
      R.capB.textContent=v.captionB;
      R.sail.style.display=v.canSail?'inline-block':'none';
      R.sail.textContent=v.sailLabel;
      v.isles.forEach((isl,i)=>{
        const e=R.crossIsles[i];
        e.ring.style.display=isl.hint?'block':'none';
        e.dot.style.background=isl.nodeFill;
        e.dot.style.border='1px solid '+isl.nodeStroke;
        e.dot.style.boxShadow=isl.nodeGlow;
        e.coord.style.opacity=isl.coordOp;
        e.label.style.opacity=isl.labelOp;
        e.yr.style.opacity=isl.yrOp;
      });
    }

    // panel
    const open=v.panelOpen;
    R.panel.style.cssText = panelCss(v, t, open);
    setVars(R.panel, t); R.panel.style.color=t.fg;
    R.backdrop.style.opacity = open?1:0;
    R.backdrop.style.pointerEvents = open?'auto':'none';
    if(v.active && state.active!==lastActiveId){
      renderPanelContent(v.active, t);
    }
    lastActiveId = state.active;

    // arrival + cv
    R.arrival.style.display = v.showArrival? 'flex':'none';
    R.cv.style.display = v.showCV? 'block':'none';
  }

  function setVars(el,t){
    el.style.setProperty('--bg',t.bg); el.style.setProperty('--panel',t.panel);
    el.style.setProperty('--fg',t.fg); el.style.setProperty('--fg2',t.fg2);
    el.style.setProperty('--mut',t.mut); el.style.setProperty('--faint',t.faint);
    el.style.setProperty('--line',t.line); el.style.setProperty('--acc',t.acc);
    el.style.setProperty('--acc2',t.acc2); el.style.setProperty('--sea',t.sea);
    el.style.setProperty('--fog',t.fog); el.style.setProperty('--fogFill',t.fogFill);
  }

  function panelCss(v, t, open){
    if(v.A){
      return `position:fixed;top:0;right:0;z-index:50;height:100vh;width:min(460px,94vw);overflow-y:auto;background:${t.panel};border-left:1px solid ${t.line};box-shadow:-30px 0 80px rgba(15,20,24,.18);transform:translateX(${open?'0':'104%'});transition:transform .55s cubic-bezier(.4,0,.2,1);color:${t.fg}`;
    }
    return `position:fixed;top:50%;left:50%;z-index:50;width:min(580px,94vw);max-height:86vh;overflow-y:auto;background:${t.panel};border:1px solid ${t.line};border-radius:3px;box-shadow:0 30px 90px rgba(15,20,24,.4);transform:translate(-50%,-50%) scale(${open?'1':'.94'});opacity:${open?'1':'0'};pointer-events:${open?'auto':'none'};transition:.5s cubic-bezier(.4,0,.2,1);color:${t.fg}`;
  }

  function renderPanelContent(active, t){
    const idxLabel = ROMAN[ISLANDS.findIndex(i=>i.id===active.id)];
    R.panel.innerHTML = `
      <div style="display:flex;flex-direction:column;padding:clamp(28px,3vw,44px)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:26px">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:${t.acc}">${esc(idxLabel)} · Landfall</div>
          <button data-r="pclose" style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:${t.mut}">Close ✕</button>
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;color:${t.mut};margin-bottom:8px">${esc(active.coord)} · ${esc(active.place)}</div>
        <h2 style="font-weight:400;font-size:clamp(28px,3.6vw,40px);line-height:1.04;letter-spacing:-.01em;margin-bottom:6px">${esc(active.name)}</h2>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:${t.acc};margin-bottom:18px">${esc(active.dates)}</div>
        <p style="font-style:italic;font-weight:300;font-size:clamp(15px,1.7vw,18px);line-height:1.55;color:${t.fg};margin-bottom:26px">${esc(active.subtitle)}</p>
        ${active.treasure?`<div style="display:inline-flex;align-self:flex-start;align-items:baseline;gap:10px;border:1px solid ${t.acc};border-radius:2px;padding:9px 14px;margin-bottom:28px">
          <span style="font-weight:400;font-size:20px;color:${t.acc}">${esc(active.treasure.value)}</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;color:${t.mut};text-transform:uppercase">treasure secured · ${esc(active.treasure.label)}</span>
        </div>`:''}
        <div style="height:1px;background:${t.line};margin-bottom:24px"></div>
        ${active.roles.map(role=>`
          <div style="margin-bottom:24px">
            <div style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between;margin-bottom:10px">
              <div style="font-weight:500;font-size:16px;letter-spacing:-.005em">${esc(role.title)}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;color:${t.mut}">${esc(role.period)}</div>
            </div>
            <ul style="display:flex;flex-direction:column;gap:9px">
              ${role.bullets.map(b=>`<li style="display:flex;gap:11px;font-weight:300;font-size:14px;line-height:1.55;color:${t.fg2}"><span style="flex:none;margin-top:8px;width:5px;height:5px;transform:rotate(45deg);background:${t.acc}"></span><span style="text-wrap:pretty">${esc(b)}</span></li>`).join('')}
            </ul>
          </div>`).join('')}
      </div>`;
    R.panel.querySelector('[data-r="pclose"]').onclick=closePanel;
  }

  /* ----------------------------- INIT ----------------------------- */
  build();
  update();
})();
</script>
</body>
</html>
